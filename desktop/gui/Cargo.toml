[package]
name = "hole-desktop"
version = "0.1.5"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.95"
description = "hole 桌面客户端（Rust + Yororen UI），通过 stdio 桥接驱动共享 Go 核心"
publish = false
build = "build.rs"

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:gpui-ce-platform", "dep:yororen_ui", "dep:image"]
embedded-core = []

[[bin]]
name = "hole-desktop"
path = "src/main.rs"
required-features = ["gui"]

[dependencies]
gpui = { package = "gpui-ce", version = "=0.3.0", optional = true }
gpui-ce-platform = { package = "gpui_ce_platform", version = "=0.3.0", features = ["font-kit", "wayland", "x11"], optional = true }
yororen_ui = { version = "=0.4.0", default-features = false, optional = true }
image = { version = "=0.25.10", default-features = false, features = ["png"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
dirs = { version = "6" }
cpal = "0.16"
flate2 = "1"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[build-dependencies]
flate2 = "1"
sha2 = "0.10"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
