[package]
name = "hole-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "hole 桌面客户端（Rust + Slint），通过 stdio 桥接驱动共享 Go 核心"
publish = false
build = "build.rs"

[[bin]]
name = "hole-desktop"
path = "src/main.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
uuid = { version = "1", features = ["v4"] }
dirs = { version = "6" }
arboard = { version = "3", default-features = false }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
