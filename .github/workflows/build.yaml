name: Build release artifacts

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      type:
        description: 构建类型；all 会构建 Android、desktop、core 和 cli
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - desktop
          - core
          - cli
      arch:
        description: 非 Android 目标架构；Android 始终固定为 arm64
        required: true
        default: all
        type: choice
        options:
          - all
          - amd64
          - arm64
      os:
        description: 非 Android 目标系统；选择 android 时忽略此项
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows

permissions:
  contents: read

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  GOTOOLCHAIN: local
  GOWORK: off
  PYTHONUTF8: '1'

jobs:
  plan:
    name: Resolve build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_targets: ${{ steps.matrix.outputs.has_targets }}
      android: ${{ steps.matrix.outputs.android }}
    steps:
      - name: Resolve requested targets
        id: matrix
        shell: bash
        env:
          BUILD_TYPE: ${{ inputs.type || 'all' }}
          BUILD_ARCH: ${{ inputs.arch || 'all' }}
          BUILD_OS: ${{ inputs.os || 'all' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          build_type = os.environ["BUILD_TYPE"]
          build_arch = os.environ["BUILD_ARCH"]
          build_os = os.environ["BUILD_OS"]

          if build_type not in {"all", "android", "desktop", "core", "cli"}:
              raise SystemExit(f"unsupported type: {build_type}")
          if build_arch not in {"all", "amd64", "arm64"}:
              raise SystemExit(f"unsupported arch: {build_arch}")
          if build_os not in {"all", "linux", "windows"}:
              raise SystemExit(f"unsupported os: {build_os}")

          targets = ("desktop", "core", "cli")
          systems = ("linux", "windows") if build_os == "all" else (build_os,)
          architectures = ("amd64", "arm64") if build_arch == "all" else (build_arch,)
          matrix = []

          for target in targets:
              if build_type not in {"all", target}:
                  continue
              for target_os in systems:
                  for target_arch in architectures:
                      # JNI packages use the host JDK/C toolchain. Windows ARM64
                      # delivery remains a local build until a native runner is configured.
                      if target == "desktop" and target_os == "windows" and target_arch == "arm64":
                          continue
                      if target_os == "linux" and target_arch == "arm64":
                          runner = "ubuntu-24.04-arm"
                      elif target_os == "linux":
                          runner = "ubuntu-24.04"
                      else:
                          runner = "windows-latest"

                      if target == "desktop":
                          artifact_path = f"dist/desktop/{target_os}-{target_arch}"
                      elif target == "core":
                          artifact_path = "dist/core"
                      else:
                          artifact_path = "dist/cli"

                      matrix.append({
                          "target": target,
                          "os": target_os,
                          "arch": target_arch,
                          "runner": runner,
                          "artifact_path": artifact_path,
                      })

          result = {"include": matrix}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"matrix={json.dumps(result, separators=(',', ':'))}\n")
              output.write(f"has_targets={str(bool(matrix)).lower()}\n")
              output.write(f"android={str(build_type in {'all', 'android'}).lower()}\n")
          PY

  build:
    name: ${{ matrix.target }} / ${{ matrix.os }} / ${{ matrix.arch }}
    needs: plan
    if: ${{ needs.plan.outputs.has_targets == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Cache project build data
        uses: actions/cache@v5
        with:
          path: |
            .cache/go-build
            .cache/go/pkg/mod
            .cache/cargo-home
            .cache/cargo-target
            .cache/gradle
          key: hole-${{ matrix.target }}-${{ matrix.os }}-${{ matrix.arch }}-${{ hashFiles('go.sum', 'desktop/compose/build.gradle.kts', 'versions.json') }}
          restore-keys: |
            hole-${{ matrix.target }}-${{ matrix.os }}-${{ matrix.arch }}-

      - name: Make python3 available on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null 2>&1; then
            mkdir -p .ci-bin
            printf '%s\n' '#!/usr/bin/env bash' 'exec python "$@"' > .ci-bin/python3
            chmod +x .ci-bin/python3
            echo "$PWD/.ci-bin" >> "$GITHUB_PATH"
          fi

      - name: Install Linux desktop dependencies
        if: ${{ runner.os == 'Linux' && matrix.target == 'desktop' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc libasound2t64 libfontconfig1 libx11-6 libxext6 libxi6 libxrender1 libxtst6 libfuse2t64 desktop-file-utils

      - name: Set up desktop JDK
        if: ${{ matrix.target == 'desktop' }}
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'

      - name: Set up Windows C compiler
        id: desktop_msys2
        if: ${{ runner.os == 'Windows' && matrix.target == 'desktop' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Configure Windows packaging tools
        if: ${{ runner.os == 'Windows' && matrix.target == 'desktop' }}
        shell: pwsh
        env:
          DESKTOP_MSYS2_LOCATION: ${{ steps.desktop_msys2.outputs.msys2-location }}
        run: |
          $gccBin = Join-Path $env:DESKTOP_MSYS2_LOCATION 'ucrt64\bin'
          $gcc = Join-Path $gccBin 'gcc.exe'
          if (-not (Test-Path $gcc)) { throw "GCC is missing: $gcc" }
          $gccBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          ('CC=' + $gcc.Replace('\', '/')) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $wixBin = 'C:\Program Files (x86)\WiX Toolset v3.14\bin'
          if (-not (Test-Path (Join-Path $wixBin 'candle.exe'))) {
            choco install wixtoolset --version=3.14.1.20250415 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
          }
          if (-not (Test-Path (Join-Path $wixBin 'candle.exe'))) { throw 'WiX candle.exe is missing' }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Prepare Linux AppImage tools
        if: ${{ runner.os == 'Linux' && matrix.target == 'desktop' }}
        shell: bash
        run: |
          set -euo pipefail
          arch=x86_64
          if [[ '${{ matrix.arch }}' == arm64 ]]; then arch=aarch64; fi
          mkdir -p .cache/appimage-tools
          curl -fL "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$arch.AppImage" -o .cache/appimage-tools/tool.AppImage
          curl -fL "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-$arch" -o .cache/appimage-tools/runtime
          chmod +x .cache/appimage-tools/tool.AppImage
          (cd .cache/appimage-tools; ./tool.AppImage --appimage-extract)
          ln -s "$PWD/.cache/appimage-tools/squashfs-root/AppRun" .cache/appimage-tools/appimagetool
          echo "$PWD/.cache/appimage-tools" >> "$GITHUB_PATH"
          echo "HOLE_APPIMAGE_RUNTIME=$PWD/.cache/appimage-tools/runtime" >> "$GITHUB_ENV"

      - name: Build target
        shell: bash
        run: |
          set -euo pipefail
          bash ./build.sh "${{ matrix.target }}" \
            --os "${{ matrix.os }}" \
            --arch "${{ matrix.arch }}" \
            --output dist
          test -d "${{ matrix.artifact_path }}"

      - name: Upload desktop packaging diagnostics
        if: ${{ failure() && matrix.target == 'desktop' }}
        uses: actions/upload-artifact@v6
        with:
          name: hole-desktop-diagnostics-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            desktop/compose/build/compose/logs/
            desktop/compose/build/compose/tmp/*.args.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload target artifact
        uses: actions/upload-artifact@v6
        with:
          name: hole-${{ matrix.target }}-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  android:
    name: android / arm64
    needs: plan
    if: ${{ needs.plan.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358'

      - name: Pin the Android environment to this runner
        shell: bash
        run: |
          set -euo pipefail
          toolchain_env="$RUNNER_TEMP/hole-toolchain.env"
          : > "$toolchain_env"
          printf 'HOLE_TOOLCHAIN_ENV=%s\n' "$toolchain_env" >> "$GITHUB_ENV"

      - name: Cache project build data
        uses: actions/cache@v5
        with:
          path: |
            .cache/bin
            .cache/go
            .cache/go-build
            .cache/gradle
            .cache/gradle-project
            .cache/kotlin
          key: hole-android-arm64-${{ hashFiles('go.sum', 'android/corebridge/gobuild/go.sum', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties', 'versions.json') }}
          restore-keys: |
            hole-android-arm64-

      - name: Install gomobile and gobind
        shell: bash
        env:
          MOBILE_VERSION: v0.0.0-20261011034528-197770444867
        run: |
          set -euo pipefail
          source scripts/build-env.sh
          export GOBIN="$HOLE_ROOT/.cache/bin"
          export PATH="$GOBIN:$PATH"
          mkdir -p "$GOBIN"
          printf 'GOBIN=%s\n' "$GOBIN" >> "$GITHUB_ENV"
          printf '%s\n' "$GOBIN" >> "$GITHUB_PATH"
          go install "golang.org/x/mobile/cmd/gomobile@$MOBILE_VERSION"
          "$GOBIN/gomobile" init
          go install "golang.org/x/mobile/cmd/gobind@$MOBILE_VERSION"
          for binary in gomobile gobind; do
            test "$(command -v "$binary")" = "$GOBIN/$binary"
            info=$(go version -m "$GOBIN/$binary")
            [[ "$info" == *$'\tmod\tgolang.org/x/mobile\t'"$MOBILE_VERSION"$'\t'* ]]
          done

      - name: Prepare Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.HOLE_SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.HOLE_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HOLE_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HOLE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || {
              echo "缺少 GitHub Actions secret：$name 对应的 Android 签名设置" >&2
              exit 1
            }
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hole-release.keystore"
          chmod 600 "$RUNNER_TEMP/hole-release.keystore"
          test -s "$RUNNER_TEMP/hole-release.keystore"
          printf 'HOLE_SIGNING_STORE_FILE=%s\n' "$RUNNER_TEMP/hole-release.keystore" >> "$GITHUB_ENV"

      - name: Build Android release
        shell: bash
        env:
          HOLE_SIGNING_STORE_PASSWORD: ${{ secrets.HOLE_SIGNING_STORE_PASSWORD }}
          HOLE_SIGNING_KEY_ALIAS: ${{ secrets.HOLE_SIGNING_KEY_ALIAS }}
          HOLE_SIGNING_KEY_PASSWORD: ${{ secrets.HOLE_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export GOBIN="$GITHUB_WORKSPACE/.cache/bin"
          export PATH="$GOBIN:$PATH"
          test "$(command -v gomobile)" = "$GOBIN/gomobile"
          test "$(command -v gobind)" = "$GOBIN/gobind"
          bash ./build.sh android --output dist
          test -d dist/android
          apk_count=$(find dist/android -maxdepth 1 -type f -name '*.apk' | wc -l)
          if [[ "$apk_count" -ne 1 ]]; then
            echo "期望 dist/android 中恰好有一个 APK，实际为 $apk_count 个" >&2
            find dist/android -maxdepth 1 -type f -printf '%f\n' | sort >&2
            exit 1
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v6
        with:
          name: hole-android-arm64
          path: "dist/android/*.apk"
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub release
    needs:
      - build
      - android
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: hole-*
          path: artifacts

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            relative=${file#artifacts/}
            artifact_name=${relative%%/*}
            filename=${file##*/}

            case "$filename" in
              *.sha256|SHA256SUMS)
                continue
                ;;
            esac

            case "$artifact_name" in
              hole-core-*)
                asset_name="$filename"
                ;;
              hole-desktop-*)
                asset_name="${artifact_name}-${filename}"
                ;;
              *)
                asset_name="$filename"
                ;;
            esac

            destination="release-assets/$asset_name"
            if [[ -e "$destination" ]]; then
              echo "重复的 Release 资产名：$asset_name" >&2
              exit 1
            fi
            cp "$file" "$destination"
          done < <(find artifacts -type f -print0)

          test -n "$(find release-assets -maxdepth 1 -type f -print -quit)"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            release-assets/*
